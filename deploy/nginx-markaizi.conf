# /etc/nginx/sites-available/markaizi  →  sites-enabled/markaizi
# markaizi → 127.0.0.1:3002 (alitelmobilya 3000, duruavize 3001 ile aynı VPS).
# SSL: DNS VPS'e yönlendikten sonra  certbot --nginx -d markaizi.com.tr -d www.markaizi.com.tr
server {
    listen 80;
    server_name markaizi.com.tr www.markaizi.com.tr;

    client_max_body_size 10M;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # src/lib/security.ts getClientIp: VPS'te x-real-ip esas alınır
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # İstemcinin uydurabileceği Vercel başlığı silinir
        proxy_set_header X-Vercel-Forwarded-For "";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
